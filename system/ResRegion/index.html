<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delivery Management System</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;700&display=swap');

        :root {
            --primary-color: #4361ee;
            --secondary-color: #3f37c9;
            --accent-color: #4cc9f0;
            --dark-color: #1a1a2e;
            --light-color: #f8f9fa;
            --success-color: #4ad66d;
            --warning-color: #f8961e;
            --danger-color: #ef233c;
            --delivery-color: #7209b7;
            --stats-color: #4895ef;
            --truck-color: #f72585;
            --map-color: #3a86ff;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            color: var(--dark-color);
            min-height: 100vh;
            background: linear-gradient(-45deg, #030303, #e73c7e, #23a6d5, #23d5ab);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
            position: relative;
        }

        .app-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 3rem;
            padding: 1rem;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .logo {
            height: 60px;
            width: auto;
        }

        .logout-btn {
            padding: 0.8rem 1.5rem;
            text-decoration: none;
            background-color: var(--danger-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .logout-btn:hover {
            background-color: #d00000;
            transform: translateY(-2px);
        }

        .cards-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            padding: 2rem;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
            cursor: pointer;
            height: 250px;
            width: 300px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        .card:hover {
            transform: translateY(-10px);
            box-shadow: 0 15px 30px rgba(0, 0, 0, 0.2);
        }

        .card-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
        }

        .card-title {
            font-size: 1.5rem;
            margin-bottom: 0.5rem;
        }

        .card-desc {
            color: #666;
            font-size: 0.9rem;
            line-height: 1.5;
        }

        .card:nth-child(1) .card-icon { color: var(--primary-color); }
        .card:nth-child(2) .card-icon { color: var(--truck-color); }
        .card:nth-child(3) .card-icon { color: var(--delivery-color); }
        .card:nth-child(4) .card-icon { color: var(--map-color); }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .card:nth-child(1) { animation: fadeIn 0.5s ease-in-out 0.1s forwards; opacity: 0; }
        .card:nth-child(2) { animation: fadeIn 0.5s ease-in-out 0.2s forwards; opacity: 0; }
        .card:nth-child(3) { animation: fadeIn 0.5s ease-in-out 0.3s forwards; opacity: 0; }
        .card:nth-child(4) { animation: fadeIn 0.5s ease-in-out 0.4s forwards; opacity: 0; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <header class="app-header">
            <div class="logo-container">
                <img src="../logo-2_1.svg" alt="Company Logo" class="logo">
            </div>
            <a href="/logout" class="logout-btn">
                <i class="fas fa-sign-out-alt"></i> Logout
            </a>
        </header>

        <div class="cards-container">
            <!-- Drivers Card -->
            <div class="card" onclick="navigateTo('/driversregion')">
                <div class="card-icon">
                    <i class="fas fa-users"></i>
                </div>
                <h3 class="card-title">Manage Drivers</h3>
                <p class="card-desc">View, edit and add drivers</p>
            </div>

            <!-- Trucks Card -->
            <div class="card" onclick="navigateTo('/trucks')">
                <div class="card-icon">
                    <i class="fas fa-truck"></i>
                </div>
                <h3 class="card-title">Manage Trucks</h3>
                <p class="card-desc">View, edit and add trucks</p>
            </div>

            <!-- Trips Card -->
            <div class="card" onclick="navigateTo('/trips')">
                <div class="card-icon">
                    <i class="fas fa-route"></i>
                </div>
                <h3 class="card-title">Manage Trips</h3>
                <p class="card-desc">Create and manage delivery trips</p>
            </div>

            <!-- Map Card -->
            <div class="card" onclick="navigateTo('/trackingmap')">
                <div class="card-icon">
                    <i class="fas fa-map-marked-alt"></i>
                </div>
                <h3 class="card-title">Region Map</h3>
                <p class="card-desc">View delivery regions and routes</p>
            </div>
        </div>
    </div>

    <script>
        // Navigation function
        function navigateTo(page) {
            window.location.href = page;
        }

        // Logout function
        async function logout() {
            try {
                await fetch("/logout", {
                    method: "POST"
                });
                
                window.location.href = "/login.html";

            } catch (error) {
                console.error("Error during logout:", error);
                alert("An error occurred during logout. Please try again.");
            }
        }
    </script>
</body>
</html>
