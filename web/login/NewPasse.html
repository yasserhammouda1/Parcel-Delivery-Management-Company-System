<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset Password</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body {
      background-color: #f8f9fa;
    }
    .reset-container {
      max-width: 400px;
      width: 100%;
    }
    .form-check-label {
      cursor: pointer;
    }
    .error-message {
      color: red;
      font-size: 0.9rem;
      margin-top: -0.5rem;
      margin-bottom: 0.75rem;
    }
  </style>
</head>
<body class="d-flex align-items-center justify-content-center min-vh-100">

  <div class="reset-container bg-white p-4 rounded shadow">
    <div class="text-center mb-4">
      <img src="logo-large.svg" alt="Logo" width="100" class="mb-2" />
      <h2 class="h5">Reset Your Password</h2>
      <p class="text-muted small">Please enter your new password below.</p>
    </div>

    <form id="resetForm" action="/reset-password" method="post" novalidate>
      <div class="form-floating mb-3">
        <input type="password" class="form-control" id="newPassword" name="newPassword" placeholder="New Password" required>
        <label for="newPassword">New Password</label>
      </div>

      <div class="form-floating mb-1">
        <input type="password" class="form-control" id="confirmPassword" name="confirmPassword" placeholder="Confirm Password" required>
        <label for="confirmPassword">Confirm Password</label>
      </div>

      <!-- Error message -->
      <div id="errorMsg" class="error-message d-none">Passwords do not match.</div>

      <div class="form-check mb-3">
        <input class="form-check-input" type="checkbox" id="showPassword">
        <label class="form-check-label" for="showPassword">Show passwords</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">Reset Password</button>
    </form>

    <div class="text-center mt-3">
      <a href="login.html" class="text-decoration-none">Back to login</a>
    </div>
  </div>

  <script>
    // Show/hide password toggle
    document.getElementById('showPassword').addEventListener('change', function () {
      const type = this.checked ? 'text' : 'password';
      document.getElementById('newPassword').type = type;
      document.getElementById('confirmPassword').type = type;
    });

    // Validate password match before form submission
    document.getElementById('resetForm').addEventListener('submit', function (e) {
      const password = document.getElementById('newPassword').value;
      const confirm = document.getElementById('confirmPassword').value;
      const errorMsg = document.getElementById('errorMsg');

      if (password !== confirm) {
        e.preventDefault();
        errorMsg.classList.remove('d-none');
      } else {
        errorMsg.classList.add('d-none');
      }
    });
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
